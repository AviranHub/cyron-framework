<html lang="fa">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   صفحه خالی
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
            font-family: 'Roboto', sans-serif;
        }
  </style>
 </head>
 <body class="bg-gray-100 text-gray-900">
  <div class="container mx-auto p-4">
   <h1 class="text-3xl font-bold">
    صفحه خالی
   </h1>
   <div class="fixed top-0 left-0 w-full h-12 bg-white flex items-center justify-between px-4 cursor-pointer" id="install-box">
    <div class="flex items-center">
     <img alt="لوگوی گوگل" class="mr-2" height="24" src="https://storage.googleapis.com/a1aa/image/cfpHZfSQ3vgDBkNJIE3xehW7RnxXu1CeqbF9ILQdD8bFgwwOB.jpg" width="24"/>
     <i class="fas fa-app">
     </i>
     <span class="ml-2">
      اسم برنامه
     </span>
    </div>
    <button class="text-red-500" onclick="closeInstallBox(event)">
     <i class="fas fa-times">
     </i>
    </button>
   </div>
  </div>
  <script>
   let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-box').style.display = 'flex';
        });

        document.getElementById('install-box').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                } else {
                    console.log('User dismissed the install prompt');
                }
                deferredPrompt = null;
                document.getElementById('install-box').style.display = 'none';
            }
        });

        function closeInstallBox(event) {
            event.stopPropagation();
            document.getElementById('install-box').style.display = 'none';
        }

        if (window.matchMedia('(display-mode: standalone)').matches) {
            document.getElementById('install-box').style.display = 'none';
        }
  </script>
 </body>
</html>
